  <rect x="33" y="78.5" width="10" height="5" rx="2.5" fill="#7cc4ff"/>
  <!-- 노트북 받침 -->
  <path d="M12 99 h104 a3 3 0 0 1 -1 2.5 l-4 4.5 a4 4 0 0 1 -3 1.3 h-90 a4 4 0 0 1 -3 -1.3 l-4 -4.5 a3 3 0 0 1 -1 -2.5 z" fill="#fff"/>
  <rect x="56" y="99" width="16" height="3" rx="1.5" fill="#bcd3f2"/>
</svg>
