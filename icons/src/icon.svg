<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 1일1코 아이콘(48·128px, 스토어용): 달력 한 장 안에 코드 에디터가 떠 있는 노트북 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a8ae8"/>
      <stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
    <clipPath id="c"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <!-- 달력 -->
  <rect width="128" height="128" rx="28" fill="url(#g)"/>
  <rect width="128" height="30" fill="#fff" fill-opacity=".22" clip-path="url(#c)"/>
  <rect x="35" y="6" width="11" height="17" rx="5.5" fill="#fff"/>
  <rect x="82" y="6" width="11" height="17" rx="5.5" fill="#fff"/>
  <!-- 노트북 화면 -->
  <rect x="22" y="42" width="84" height="54" rx="7" fill="#fff"/>
  <rect x="27" y="47" width="74" height="44" rx="3" fill="#10294d"/>
  <!-- 문법 강조된 코드 줄 -->
  <rect x="33" y="53" width="16" height="5" rx="2.5" fill="#7cc4ff"/>
  <rect x="52" y="53" width="14" height="5" rx="2.5" fill="#ffd166"/>
  <rect x="41" y="61.5" width="26" height="5" rx="2.5" fill="#9be38f"/>
  <rect x="41" y="70" width="14" height="5" rx="2.5" fill="#ff8fa3"/>
